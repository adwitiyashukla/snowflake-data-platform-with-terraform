[project]
name = "pulse"
version = "0.1.0"
description = "Snowflake platform for a SaaS startup: Terraform, Snowpipe, dynamic tables, governance, PR environments and cost reports"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "snowflake-connector-python>=3.12",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "moto[s3]>=5",
    "duckdb>=1.1",
    "sqlglot>=25",
    "python-hcl2>=5",
    "ruff>=0.6",
    "sqlfluff>=3.2",
    "schemachange>=4.3",
]

[project.scripts]
pulse = "pulse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pulse*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
